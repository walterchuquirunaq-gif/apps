<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devocional · Conversando con Dios</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fcfbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12172a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devocional">
<style>
html,body{margin:0;height:100%;background:#fcfbf8;color:#4a5263;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){html,body{background:#12172a;color:#c2c3c9}}
main{display:flex;min-height:100%;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
img{width:72px;height:72px;border-radius:16px;display:block;margin:0 auto 14px}
p{margin:0;max-width:30ch}
</style>
</head>
<body>
<main><div><img src="icono-192.png" alt=""><p id="msg">Abriendo el devocional…</p></div></main>
<script>
/* Puerta de entrada de la app: abre el mes actual.
   Si el mes actual todavía no está subido (o no hay internet y no se guardó), abre el anterior que sí esté. */
(function(){
"use strict";
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
var MN=["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"];
var INI=2026*12+8;   // primer mes de la app: setiembre 2026
function arch(i){ var y=Math.floor(i/12), m=i%12+1; return "Devocional_"+y+"-"+(m<10?"0":"")+m+"_"+MN[m]+".html"; }
var d=new Date(), hoy=d.getFullYear()*12+d.getMonth(), orden=[];
for(var i=hoy;i>=INI;i--) orden.push(i);
orden.push(hoy+1);
function probar(k){
  if(k>=orden.length){
    document.getElementById("msg").textContent="No pude abrir el devocional. Revisa tu conexión a internet y vuelve a intentarlo.";
    return;
  }
  var f=arch(orden[k]);
  fetch(f,{method:"HEAD",cache:"no-cache"}).then(function(r){
    if(r.ok) location.replace(f+location.hash); else probar(k+1);
  },function(){ probar(k+1); });
}
probar(0);
})();
</script>
</body>
</html>
